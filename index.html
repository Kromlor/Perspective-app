<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCOPE Perspective Lab</title>
<!-- SCOPE Perspective Lab v1 (Unit 1). Single file. Offline. No accounts. Data stays in this browser. -->
<style>:root{
  color-scheme: light;
  --ink:#1F1B3A; --bg:#EDF0FF; --panel:#FFFFFF; --muted:#5B5A7A; --line:#CFD3EE; --soft:#F6F7FF;
  --S:#0EA5B7; --C:#F97316; --O:#8B5CF6; --P:#EC4899; --E:#16A34A; --sun:#FFD23F; --bad:#DC2626; --ok:#16A34A;
  --kid: Verdana, Tahoma, "Segoe UI", system-ui, sans-serif;
  --head: "Arial Rounded MT Bold", ui-rounded, "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --ui: system-ui, "Segoe UI", Roboto, sans-serif;
  --hard: 4px 4px 0 var(--ink);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;width:100%}
textarea{min-height:80px;resize:vertical}
label{font-weight:600;font-size:14px;display:block;margin:10px 0 4px}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.15}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* ---------- buttons ---------- */
.btn{border:2px solid var(--ink);background:#fff;border-radius:12px;padding:8px 14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;box-shadow:2px 2px 0 var(--ink);transition:transform .06s, box-shadow .06s}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--ink);color:#fff}
.btn.go{background:var(--sun)}
.btn.ghost{border-color:transparent;box-shadow:none;background:transparent}
.btn.ghost:hover{background:#0000000d}
.btn.danger{color:var(--bad);border-color:var(--bad);box-shadow:2px 2px 0 var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{font-size:20px;padding:12px 22px;border-radius:16px;box-shadow:var(--hard)}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:14px;padding:14px 24px;background:var(--ink);color:#fff}
.logo{display:flex;align-items:center;gap:10px}
.logo .lens{display:flex;gap:3px}
.logo .lens span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:900 15px var(--head);color:#fff;border:2px solid #fff}
.logo h1{font-size:20px;color:#fff}
.top .btn{background:transparent;color:#fff;border-color:#ffffff55;box-shadow:none}
.top .btn:hover{background:#ffffff1a}
.wrap{max-width:1180px;margin:0 auto;padding:24px}

/* ---------- roster ---------- */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px;margin-top:16px}
.scard{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:16px;box-shadow:var(--hard);display:flex;flex-direction:column;gap:8px}
.scard h3{font-size:22px}
.scard .meta{font-size:13px;color:var(--muted)}
.scard .next{background:var(--soft);border-radius:12px;padding:10px;border:2px dashed var(--line)}
.scard .next b{font-family:var(--head);font-size:17px}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;border:1.5px solid var(--ink);background:#fff}
.empty{background:#fff;border:3px dashed var(--line);border-radius:18px;padding:40px;text-align:center}
.empty h2{margin-bottom:8px}

/* ---------- library ---------- */
.unit{margin-top:22px}
.unit h2{font-size:22px;display:flex;align-items:center;gap:10px}
.unit h2 .num{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;border:2px solid var(--ink);font-size:18px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:10px}
.lcard{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.lcard.soon{opacity:.6;border-style:dashed}
.lcard .n{font:900 13px var(--head);color:var(--muted)}
.lcard h4{margin:0;font:800 16px var(--head)}
.lcard .codes{font-size:12px;color:var(--muted)}

/* ---------- tables ---------- */
table{border-collapse:collapse;width:100%;background:#fff;border-radius:12px;overflow:hidden}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:top}
th{background:var(--soft);font-size:12px;color:var(--muted)}
.panel{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:16px}

/* ---------- modal ---------- */
.modal-bg{position:fixed;inset:0;background:#1F1B3A88;display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:var(--hard);max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:20px}
.modal h2{margin-bottom:6px}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;z-index:60;font-weight:700}

/* ============ SESSION ============ */
.sess{display:grid;grid-template-rows:auto 1fr auto;height:100vh}
.sbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:3px solid var(--ink)}
.sbar .title{font:800 17px var(--head)}
.sbar .who{font-size:13px;color:var(--muted)}
.phases{display:flex;gap:4px;margin:0 auto}
.phases span{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;border:2px solid var(--line);color:var(--muted);background:#fff;white-space:nowrap}
.phases span.on{border-color:var(--ink);background:var(--sun);color:var(--ink)}
.phases span.done{background:var(--soft);color:var(--ink)}
.timer{font:700 15px var(--ui);font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:8px;background:var(--soft)}
.sbody{display:grid;grid-template-columns:88px 1fr;min-height:0}
.rail{background:#fff;border-right:3px solid var(--ink);display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 0}
.rail .lens{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--ink);font:900 26px var(--head);color:#fff;opacity:.35;transition:transform .15s, opacity .15s;position:relative}
.rail .lens.on{opacity:1;transform:scale(1.18);box-shadow:3px 3px 0 var(--ink)}
.rail .lens.done{opacity:.85}
.stage{overflow:auto;padding:18px 22px;min-height:0}
.slpbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#2A2550;color:#E9E8FF;border-top:3px solid var(--ink);flex-wrap:wrap}
.slpbar .tag{font:800 11px var(--ui);background:#ffffff22;padding:3px 8px;border-radius:6px;letter-spacing:.02em}
.slpbar .btn{box-shadow:none;border-color:#ffffff55;background:transparent;color:#fff}
.slpbar .btn.go{background:var(--sun);color:var(--ink);border-color:var(--sun)}
.slpbar .tip{font-size:13px;max-width:640px}
.marks{display:flex;gap:6px;align-items:center}
.marks button{border:2px solid #ffffff55;background:transparent;color:#fff;border-radius:10px;padding:6px 10px;font-weight:800;font-size:14px}
.marks button.sug{border-style:dashed;border-color:#fff}
.marks button.on[data-m=I]{background:var(--ok);border-color:var(--ok)}
.marks button.on[data-m=P]{background:#F59E0B;border-color:#F59E0B;color:var(--ink)}
.marks button.on[data-m=X]{background:var(--bad);border-color:var(--bad)}

/* kid-facing text */
.kid{font-family:var(--kid)}
.say{font-family:var(--kid);font-size:24px;font-weight:700;line-height:1.35}
.say.sm{font-size:20px}
.spk{border:2px solid var(--ink);background:#fff;border-radius:50%;width:38px;height:38px;display:inline-grid;place-items:center;font-size:18px;vertical-align:middle;margin-left:6px;flex:none;box-shadow:2px 2px 0 var(--ink)}
.spk:active{transform:translate(2px,2px);box-shadow:none}
.goalbox{display:flex;gap:12px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:12px 16px;box-shadow:var(--hard)}

/* scene */
.explore{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:18px;align-items:start}
.scene{position:relative;border:4px solid var(--ink);border-radius:18px;overflow:hidden;background:#fff;box-shadow:var(--hard);aspect-ratio:16/9}
.scene svg.scenesvg{position:absolute;inset:0;width:100%;height:100%;display:block}
.facewrap{width:min(280px,60vw);aspect-ratio:132/124;border:4px solid var(--ink);border-radius:18px;overflow:hidden;box-shadow:var(--hard);margin:0 auto}
.facewrap svg{width:100%;height:100%;display:block}
.bub{position:absolute;transform:translate(-50%,-100%);background:#fff;border:3px solid var(--ink);border-radius:18px;padding:6px 12px;font:700 clamp(13px,1.6vw,20px) var(--kid);max-width:46%;text-align:center;cursor:pointer;z-index:3;line-height:1.25}
.bub::after{content:"";position:absolute;left:var(--tail,50%);bottom:-13px;margin-left:-8px;border:8px solid transparent;border-top:12px solid var(--ink)}
.bub::before{content:"";position:absolute;left:var(--tail,50%);bottom:-8px;margin-left:-6px;border:6px solid transparent;border-top:9px solid #fff;z-index:1}
.bub.side::after,.bub.side::before{display:none}
.bub.think{border-radius:30px;background:#F5F3FF;border-style:dashed}
.bub.think::after,.bub.think::before{display:none}
.bub.whisper{border-style:dotted;font-style:italic;font-weight:600}
.spot{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);background:var(--sun);font:900 18px var(--head);display:grid;place-items:center;z-index:4;box-shadow:2px 2px 0 var(--ink);animation:pulse 1.8s ease-in-out infinite}
.spot.found{animation:none;background:#fff}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.12)}}
@media (prefers-reduced-motion:reduce){.spot{animation:none}}
.spotlabel{position:absolute;transform:translate(-50%,8px);background:var(--ink);color:#fff;font:700 clamp(12px,1.3vw,16px) var(--kid);padding:5px 10px;border-radius:10px;z-index:5;max-width:40%;text-align:center;pointer-events:none}
.pickbox{position:absolute;border:3px dashed transparent;border-radius:16px;z-index:4;background:transparent}
.pickbox:hover{border-color:#ffffffaa}
.pickbox.sel{border-color:var(--sun);background:#FFD23F33}
.pickbox.right{border-color:var(--ok);border-style:solid;background:#16A34A22}
.pickbox.wrong{border-color:var(--bad);border-style:solid;background:#DC262622}
.pickbox .nm{position:absolute;bottom:-2px;left:50%;transform:translate(-50%,100%);background:#fff;border:2px solid var(--ink);border-radius:8px;padding:0 6px;font:800 13px var(--ui);white-space:nowrap}
.mediatabs{display:flex;gap:6px;margin-bottom:8px}
.mediatabs button{border:2px solid var(--ink);background:#fff;border-radius:10px;padding:4px 12px;font-weight:700}
.mediatabs button.on{background:var(--ink);color:#fff}
.mediabox{border:4px solid var(--ink);border-radius:18px;overflow:hidden;aspect-ratio:16/9;background:#000;box-shadow:var(--hard)}
.mediabox iframe,.mediabox img{width:100%;height:100%;border:0;display:block;object-fit:contain;background:#000}

/* step cards */
.steps{display:flex;flex-direction:column;gap:10px}
.step{border:3px solid var(--ink);border-radius:18px;background:#fff;padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--hard)}
.step .hd{display:flex;align-items:center;gap:10px}
.step .badge{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;color:#fff;font:900 22px var(--head);flex:none}
.step .word{font:900 20px var(--head)}
.step .ans{border-radius:14px;padding:10px 12px;background:var(--soft);border:2px dashed var(--line)}
.step .ans ul{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.step .ans li{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:6px 10px;font:700 18px var(--kid);display:flex;align-items:center;gap:6px}
.step .ans li.best{background:#DCFCE7}
.step .ans li .bt{margin-left:auto;font:800 11px var(--ui);background:var(--ok);color:#fff;padding:2px 6px;border-radius:6px}
.stepnav{display:flex;gap:8px;flex-wrap:wrap}
.ministeps{display:flex;gap:6px}
.ministeps button{width:34px;height:34px;border-radius:50%;border:2.5px solid var(--ink);font:900 15px var(--head);color:#fff;opacity:.4}
.ministeps button.on{opacity:1;box-shadow:2px 2px 0 var(--ink)}
.ministeps button.seen{opacity:.8}

/* tone cards */
.tones{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.tone{border:3px solid var(--ink);border-radius:16px;background:#fff;padding:10px;text-align:center;box-shadow:3px 3px 0 var(--ink)}
.tone .em{font-size:38px;line-height:1}
.tone .t{font:800 17px var(--head)}
.tone .how{font-size:12px;color:var(--muted);margin-top:4px;border-top:1px dashed var(--line);padding-top:4px}
.tone .means{font:700 16px var(--kid);background:#FEF9C3;border-radius:10px;padding:6px;margin-top:6px}
.bigline{font:900 clamp(36px,6vw,64px) var(--kid);text-align:center;background:#fff;border:4px solid var(--ink);border-radius:24px;padding:18px;box-shadow:var(--hard);position:relative}

/* items */
.item{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.item.withpic{max-width:1100px}
.itemgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,1fr);gap:20px;align-items:start}
.qrow{display:flex;align-items:flex-start;gap:6px}
.choices{display:grid;gap:12px}
.choices.many{grid-template-columns:1fr 1fr}
.choice{border:3px solid var(--ink);border-radius:18px;padding:14px 18px;text-align:left;font:700 21px var(--kid);background:#fff;box-shadow:var(--hard);transition:transform .06s, box-shadow .06s}
.choice:nth-child(4n+1){background:#E0F7FA}.choice:nth-child(4n+2){background:#FFEDD5}.choice:nth-child(4n+3){background:#EDE9FE}.choice:nth-child(4n+4){background:#FCE7F3}
.choice:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.choice.right{background:#BBF7D0!important;outline:4px solid var(--ok)}
.choice.wrong{background:#FECACA!important;animation:shake .35s}
.choice.dim{opacity:.45}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{border-radius:16px;padding:12px 16px;font:700 19px var(--kid);border:3px solid var(--ink)}
.fb.ok{background:#DCFCE7}
.fb.no{background:#FEF3C7}
.prog{display:flex;gap:6px;justify-content:center}
.prog i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.prog i.on{background:var(--sun)}
.prog i.done{background:var(--ink)}
.peek{position:absolute;top:8px;right:8px;font:800 12px var(--ui);border:2px dashed var(--muted);color:var(--muted);background:#fff;border-radius:8px;padding:4px 8px;user-select:none}
.peekout{position:absolute;inset:0;background:#2A2550;color:#fff;border-radius:20px;display:grid;place-items:center;text-align:center;font:800 22px var(--ui);padding:10px}
.sortwrap{display:grid;gap:14px}
.sortcards{display:flex;flex-wrap:wrap;gap:10px;min-height:60px}
.scard2{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:10px 12px;font:700 17px var(--kid);box-shadow:3px 3px 0 var(--ink);max-width:320px;text-align:left}
.scard2.sel{background:var(--sun)}
.scard2.right{background:#BBF7D0}
.scard2.wrong{background:#FECACA}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bin{border:3px dashed var(--ink);border-radius:18px;padding:12px;min-height:150px;background:#ffffffaa;display:flex;flex-direction:column;gap:8px}
.bin h4{margin:0;font:900 20px var(--head)}
.bin.ready{background:#FEF9C3;border-style:solid}
.counter{font:800 16px var(--ui);background:#fff;border:2px solid var(--ink);border-radius:999px;padding:4px 12px;display:inline-block}

/* talk */
.talk{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.prompt{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:18px;box-shadow:var(--hard);display:flex;gap:10px;align-items:flex-start}
.prompt .q{flex:1}
.starters{display:flex;flex-wrap:wrap;gap:10px}
.starter{border:3px solid var(--ink);border-radius:999px;padding:8px 16px;font:700 18px var(--kid);background:#FEF9C3;box-shadow:2px 2px 0 var(--ink)}

/* done */
.done{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center}
.stamp{width:150px;height:150px;border-radius:50%;border:5px solid var(--ink);background:var(--sun);display:grid;place-items:center;font:900 26px var(--head);box-shadow:var(--hard);transform:rotate(-8deg)}
.slpdone{width:100%;text-align:left;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:16px}
.slpdone h3{font-size:18px;margin-bottom:8px}
.minimarks button{border:2px solid var(--line);background:#fff;border-radius:8px;padding:2px 8px;font-weight:800;font-size:13px}
.minimarks button.on[data-m=I]{background:var(--ok);color:#fff;border-color:var(--ok)}
.minimarks button.on[data-m=P]{background:#F59E0B;border-color:#F59E0B}
.minimarks button.on[data-m=X]{background:var(--bad);color:#fff;border-color:var(--bad)}
.stat{display:inline-flex;flex-direction:column;align-items:center;background:var(--soft);border-radius:12px;padding:8px 14px;border:2px solid var(--line)}
.stat b{font:900 24px var(--head)}

.graph svg{width:100%;height:auto;display:block}

@media (max-width:980px){
  .explore,.itemgrid{grid-template-columns:1fr}
  .phases span{display:none}.phases span.on{display:inline}
  .sbody{grid-template-columns:64px 1fr}
  .rail .lens{width:44px;height:44px;font-size:20px}
  .say{font-size:21px}.choice{font-size:19px}
}
@media print{.top,.btn{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   SETTINGS — the SLP or district can change these.
   ============================================================ */
const SETTINGS = {
  appTitle: 'SCOPE Perspective Lab',
  // How many practice sessions come after each core lesson, by service schedule.
  practiceBySchedule: { 1: 1, 2: 2, 3: 3 },
  readAloud: true,          // show the read-aloud buttons
  voiceRate: 0.9,           // read-aloud speed (0.5 – 1.5)
  shortVersionDefault: false,
  checkItemsCore: 4,        // quick-check items in a core lesson (short version uses 3)
  checkItemsPractice: 4,
  masteryPercent: 80        // % independent on the quick check that suggests "ready to move on"
};

/* ============================================================
   STANDARDS — ND ELA Content Standards (June 2023), grades 6–8.
   Lessons list codes like 'R.2'; the app shows the code for the
   student's grade (6.R.2, 7.R.2, 8.R.2).
   SEL: paste NDMTSS SEL goal codes into SEL_GOALS and the "sel"
   list on each lesson when ready. Nothing else needs to change.
   ============================================================ */
const STANDARDS = {
  'R.2': {
    6: 'Comprehend a variety of texts while developing inferences and providing supportive textual evidence.',
    7: 'Comprehend a variety of texts while developing inferences and providing supportive textual evidence and reasoning.',
    8: 'Comprehend a variety of texts while developing inferences and providing relevant textual evidence and reasoning.' },
  'R.5': {
    6: 'Determine the meaning of words and phrases as they are used in the text, including figurative, denotative, and connotative meanings.',
    7: 'Determine the meaning and purpose of words and phrases as they contribute to the text, including figurative, denotative, and connotative meanings.',
    8: 'Determine the meaning and purpose of words and phrases as they contribute to the text, including figurative, denotative, and connotative meanings.' },
  'R.7': {
    6: 'Describe how an author uses figurative language and specific word choice to affect meaning in a text.',
    7: 'Analyze how an author uses figurative language and specific word choice to affect the meaning in a text.',
    8: 'Analyze how an author uses figurative language and specific word choice to affect the meaning and tone.' },
  'R.8b': {
    6: 'Identify the point of view and describe how it affects the story.',
    7: 'Analyze the point of view and describe how it affects the story.',
    8: "Analyze how a story's point of view affects the text's overall meaning." },
  'C.2': {
    6: 'Present ideas using proper eye contact, body language, volume, and pronunciation in formal and informal presentations.',
    7: 'Present ideas using proper eye contact, body language, volume, and pronunciation in formal and informal presentations.',
    8: 'Present ideas using proper eye contact, body language, volume, and pronunciation in formal and informal presentations.' },
  'C.5': {
    6: 'Prepare for discussions by finding relevant connections to the topic or text.',
    7: 'Prepare for discussions by finding relevant and specific connections to the topic or text.',
    8: 'Prepare for discussions by finding relevant and specific connections to the topic or text.' },
  'C.6': {
    6: 'Engage in a range of discussions and/or debates using active listening skills to be focused and present.',
    7: "Engage in a range of discussions and/or debates: use active listening skills to stay focused and present; reference others' ideas and/or connections to a text.",
    8: "Engage in a range of discussions and/or debates: use active listening skills to stay focused and present; reference others' ideas and/or connections to a text; synthesize texts." },
  'C.7': {
    6: 'Collaborate cooperatively with peers to accomplish a common goal or purpose.',
    7: 'Collaborate cooperatively with peers to accomplish a common goal or purpose.',

  } else {

  }
  const sh = slump?8:0; // shoulders drop
  // back hair (front view) drawn before body
  if (!away) g+=`<g transform="translate(0,${slump?10:0})">${hairBack(c)}</g>`;
  // arms behind (if not over)
  const armW = 13;
  const Ls=[-34,-214+sh], Rs=[34,-214+sh];
  const armColor = (c.top==='tee'||c.top==='jersey')? c.skin : c.shirt;
  const sleeve = c.shirt;
  const drawArms = ()=>{

    if (item && (o.pose==='hold'||o.pose==='phone'||pose.item)) a+=heldItem(item,(pose.L[1][0]+pose.R[1][0])/2,(pose.L[1][1]+pose.R[1][1])/2-4);

    if (c.top==='track') g+=`<path d="M0,${top} V-122" stroke="${INK}" stroke-width="2"/><path d="M-34,-200 l68,0" stroke="#fff" stroke-width="5" opacity=".8"/><path d="M-4,${top+4} q-14,30 4,44" fill="none" stroke="#9CA3AF" stroke-width="2"/><circle cx="2" cy="${top+50}" r="6" fill="#CBD5E1" stroke="${INK}" stroke-width="2"/>`;
  } else {
    if (c.top==='hoodie') g+=`<path d="M-22,${top} Q0,${top+30} 22,${top}" fill="${c.shirt}" stroke="${INK}" stroke-width="2.2"/>`;
    if (c.top==='jersey') g+=`<text x="0" y="-160" text-anchor="middle" font-size="30" font-weight="900" fill="#fff" stroke="${INK}" stroke-width="1.2" font-family="system-ui">${c.num||''}</text>`;
  }
  // neck + head
  const headDy = slump?14:0, tilt = slump? 8 : (o.tilt||0);
  g+=`<g transform="translate(0,${headDy}) rotate(${tilt},0,-240)">`;
  g+=`<rect x="-9" y="-246" width="18" height="24" fill="${c.skin}" stroke="${INK}" stroke-width="2.4"/>`;
  g+=`<circle cx="-28" cy="-266" r="6" fill="${c.skin}" stroke="${INK}" stroke-width="2.4"/><circle cx="28" cy="-266" r="6" fill="${c.skin}" stroke="${INK}" stroke-width="2.4"/>`;
  g+=`<ellipse cx="0" cy="-268" rx="27" ry="30" fill="${c.skin}" stroke="${INK}" stroke-width="2.6"/>`;
  if (away){
    g+=`<ellipse cx="0" cy="-270" rx="28" ry="31" fill="${c.hc}" stroke="${INK}" stroke-width="2.6"/>`;
    if (c.hair==='curlylong') g+=hairBack(c);

  }
  g+='</g>';
  if (pose.over) g+=drawArms();
  g+='</g></g>';
  return g;
}

/* ---------- face close-up ---------- */
function faceSVG(f){
  const c=CAST[f.who]||CAST.ben;
  const o={who:f.who, x:200, floor:0, expr:f.expr, look:f.look, tear:f.tear, blush:f.blush, sweat:f.sweat};
  // render just head region by drawing char and cropping via viewBox
  return `<svg class="facesvg" viewBox="-66 -334 132 124" role="img" aria-label="${esc(c.name)} face"><rect x="-66" y="-334" width="132" height="124" fill="${f.tint||'#FEF3C7'}"/>${drawChar(Object.assign(o,{x:0}))}</svg>`;
}

/* ---------- full scene ---------- */
function sceneSVG(sc){
  if (sc.face) return faceSVG(Object.assign({tint:sc.tint},sc.face));
  let s=`<svg class="scenesvg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${esc(sc.alt||'scene')}"><defs><marker id="arrowhead" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#F43F5E"/></marker></defs>`;
  s+=bg(sc.bg, sc.tint);
  (sc.props||[]).filter(p=>!p.front).forEach(p=>s+=prop(p));
  (sc.chars||[]).slice().sort((a,b)=>(a.z||0)-(b.z||0)).forEach(ch=>s+=drawChar(ch));
  (sc.props||[]).filter(p=>p.front).forEach(p=>s+=prop(p));
  s+='</svg>';
  return s;
}

/* bubble positions in % of the 800x450 box */
function bubbleAnchors(sc){
  return (sc.bubbles||[]).map(b=>{
    let ax=b.x, ay=b.y;
    if (b.who){const ch=(sc.chars||[]).find(c=>(c.id||c.who)===b.who); if(ch){const h=headTop(ch); ax=h.x; ay=h.y;}}
    ax=(ax||400)+(b.dx||0); ay=(ay||100)+(b.dy==null?-10:b.dy);
    return Object.assign({}, b, {px: ax/8, py: ay/4.5});
  });
}
function charBoxes(sc){
  return (sc.chars||[]).map(ch=>{
    const c=CAST[ch.who]||CAST.ben, s=(ch.s||1)*(c.adult?1.1:1), floor=ch.floor==null?428:ch.floor;
    const top=floor+((ch.sit?58:0)-312)*s, bottom=floor+(ch.sit?0:6)*s;
    return {id:ch.id||ch.who, name:c.name, left:(ch.x-48*s)/8, top:top/4.5, w:96*s/8, h:(bottom-top)/4.5};
  });
}

function speak(text){
  if(!('speechSynthesis' in window)||!text) return;

/* ---------- lesson helpers ---------- */
const isBuilt = n => !!LESSONS[n];
const catalog = n => CATALOG.find(c=>c[0]===n);
const unitOf = n => UNITS.find(u=>u.n===catalog(n)[1]);
const codesFor = (n, grade) => catalog(n)[3].map(c=>`${grade||6}.${c}`);
function practiceTarget(st){ return (DB.prefs.practice||{})[st.schedule] ?? SETTINGS.practiceBySchedule[st.schedule] ?? 1; }
function nextLabel(nx){ if(!nx) return ''; const c=catalog(nx.lesson); return `Lesson ${nx.lesson} · ${c?c[2]:''} · ${nx.type==='core'?'Core lesson':'Practice '+nx.p}`; }
function computeNext(st, lessonId, type, p){
  const target = practiceTarget(st);
  if(type==='core') return target>0 ? {lesson:lessonId, type:'practice', p:1} : advance(lessonId);
  if(p < target) return {lesson:lessonId, type:'practice', p:p+1};
  return advance(lessonId, p);
  function advance(id, p){ const n=id+1; if(n<=40 && isBuilt(n)) return {lesson:n, type:'core', p:0}; return {lesson:id, type:'practice', p:(p||0)+1, waiting:n<=40?n:null}; }
}
function practiceRuns(stId, lessonId){ return DB.sessions.filter(s=>s.studentId===stId && s.lesson===lessonId && s.type==='practice').length; }
function rotate(arr, start, n){ if(!arr.length) return []; if(arr.length<=n) return arr.slice(); const out=[]; for(let i=0;i<n;i++) out.push(arr[(start+i)%arr.length]); return out; }

function graph(ss){
  if(ss.length<1) return '<p class="muted">The graph appears after the first session.</p>';
  const W=900,H=180,pad=34, n=ss.length, xs=i=> n===1? W/2 : pad+i*(W-2*pad)/(n-1), ys=v=>H-pad-(v/100)*(H-2*pad);
  const line=(key,col)=>`<polyline fill="none" stroke="${col}" stroke-width="3" points="${ss.map((s,i)=>xs(i)+','+ys(s[key])).join(' ')}"/>`+ss.map((s,i)=>`<circle cx="${xs(i)}" cy="${ys(s[key])}" r="5" fill="${col}" stroke="#1F1B3A" stroke-width="1.5"><title>${fmtDate(s.date)} L${s.lesson}: ${s[key]}%</title></circle>`).join('');
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress graph">`;
  [0,50,80,100].forEach(v=>g+=`<line x1="${pad}" x2="${W-pad}" y1="${ys(v)}" y2="${ys(v)}" stroke="${v===80?'#16A34A':'#CFD3EE'}" stroke-dasharray="${v===80?'6 4':''}"/><text x="4" y="${ys(v)+4}" font-size="11" fill="#5B5A7A">${v}%</text>`);
  g+=line('pctCorrect','#F59E0B')+line('pctInd','#0EA5B7');
  g+=ss.map((s,i)=>`<text x="${xs(i)}" y="${H-10}" font-size="10" text-anchor="middle" fill="#5B5A7A">L${s.lesson}${s.type==='core'?'':'p'}</text>`).join('');
  g+='</svg><div class="small row" style="gap:16px"><span><b style="color:#0EA5B7">●</b> % independent</span><span><b style="color:#F59E0B">●</b> % correct (independent + prompted)</span><span><b style="color:#16A34A">- -</b> '+SETTINGS.masteryPercent+'% mastery line</span></div>';
  return g;
}

function shrinkImage(file, max, cb){
  const r=new FileReader(); r.onload=()=>{const img=new Image(); img.onload=()=>{const s=Math.min(1, max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); cb(c.toDataURL('image/jpeg',0.78));}; img.src=r.result;}; r.readAsDataURL(file);
}

let S=null, timerInt=null;
const PHASES=[{k:'warm',t:'Warm-up'},{k:'explore',t:'Explore'},{k:'talk',t:'Talk it through'},{k:'tryit',t:'Try it'},{k:'check',t:'Quick check'},{k:'done',t:'Done'}];

function startSession(st, lessonId, type, p){
  const L=LESSONS[lessonId]; if(!L){toast('That lesson is not built yet.'); return;}
  const runNo = st? practiceRuns(st.id, lessonId) : 0;
  const short = DB.prefs.short;
  S={st, preview:!st, lessonId, type, p:p||1, runNo, short, L, phase:0, start:Date.now(), stepIdx:0, seen:{}, results:[], tryIdx:0, chkIdx:0};
  buildContent();
  renderSession();
  clearInterval(timerInt); timerInt=setInterval(()=>{const t=$('#tmr'); if(t){const s=Math.floor((Date.now()-S.start)/1000); t.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}},1000);
}
function buildContent(){
  const L=S.L, core=L.core, pr=L.practice;
  const isCore=S.type==='core', n=S.runNo;
  const nCheck = L.unitCheck && isCore ? (S.short?6:8) : (S.short?3:(isCore?SETTINGS.checkItemsCore:SETTINGS.checkItemsPractice));
  S.explore = isCore ? core.explore : pr.scenes[n % pr.scenes.length];
  S.warm = isCore ? core.warm : Object.assign({}, core.check[n % core.check.length]);
  S.talk = core.talk;
  const tryPool = isCore ? core.tryit.items : pr.tryit.items;
  const tryN = S.short ? 3 : 5;
  S.tryTitle = isCore ? core.tryit.title : pr.tryit.title;
  S.tryItems = isCore ? tryPool.slice(0, S.short?3:tryPool.length) : rotate(tryPool, n*tryN, tryN);
  S.checkItems = isCore ? core.check.slice(0,nCheck) : rotate(pr.check, n*nCheck, nCheck);
  S.results = S.checkItems.map(it=>({q:it.q, line:it.line||'', first:null, tries:0, sug:null, mark:null}));
  S.phases = PHASES.filter(ph=>!(S.short && ph.k==='warm'));
  const ex=S.explore; S.stepList = ex.steps.filter(s=>!(S.short&&s.ext)).slice();
  if (ex.compare){ const pi=S.stepList.findIndex(s=>s.k==='P'); S.stepList.splice(pi+1,0,{k:'P', compare:ex.compare}); }
}
function curPhase(){return S.phases[S.phase].k;}

function renderSession(){
  speechSynthesis && speechSynthesis.cancel && speechSynthesis.cancel();
  const c=catalog(S.lessonId), L=S.L;
  const app=$('#app');
  const ph=curPhase();
  app.innerHTML = `<div class="sess">
    <div class="sbar">
      <button class="btn ghost" id="exit" title="Leave session">✕</button>
      <div><div class="title">${S.lessonId}. ${esc(c[2])}</div><div class="who">${S.preview?'Preview · nothing is saved':esc(S.st.name)} · ${S.type==='core'?'Core lesson':'Practice '+S.p}${S.short?' · short':''}</div></div>
      <div class="phases">${S.phases.map((p,i)=>`<span class="${i===S.phase?'on':i<S.phase?'done':''}">${p.t}</span>`).join('')}</div>
      <span class="timer" id="tmr">0:00</span>
    </div>
    <div class="sbody">
      <aside class="rail" aria-label="SCOPE steps">${'SCOPE'.split('').map(k=>`<div class="lens ${railState(k)}" style="background:${SCOPE_STEPS[k].color}" title="${SCOPE_STEPS[k].word}">${k}</div>`).join('')}</aside>
      <main class="stage" id="stage"></main>
    </div>
    <div class="slpbar" id="slpbar"></div>
  </div>`;
  $('#exit').onclick=()=>{ if(S.preview||curPhase()==='done'&&S.saved){endSession();return;} confirmBox('Leave this session?', 'This session has not been saved. Its data will be lost.', 'Leave without saving', endSession); };
  const stage=$('#stage');
  if(ph==='warm') phaseWarm(stage);
  if(ph==='explore') phaseExplore(stage);
  if(ph==='talk') phaseTalk(stage);
  if(ph==='tryit') phaseTry(stage);
  if(ph==='check') phaseCheck(stage);
  if(ph==='done') phaseDone(stage);
  requestAnimationFrame(fitBubbles);
  const s=Math.floor((Date.now()-S.start)/1000); $('#tmr').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
}
function railState(k){
  const ph=curPhase();
  if(ph==='explore'){const cur=S.stepList[S.stepIdx]; if(cur&&cur.k===k) return 'on'; if(S.stepList.some((s,i)=>s.k===k&&S.seen[i])) return 'done'; return '';}
  if(ph==='done') return 'done';
  return 'done';
}
function endSession(){clearInterval(timerInt); S=null; speechSynthesis&&speechSynthesis.cancel&&speechSynthesis.cancel(); renderHome();}
function slpBar(inner, nextLabel, nextOk=true){
  const ph=curPhase(); const tip = S.L.slp.tips;

  $('#tipBtn').onclick=()=>modal(`<h2>SLP tips</h2><p>${esc(tip)}</p>${DB.media[S.lessonId]&&DB.media[S.lessonId].note?`<p><b>Your media note:</b> ${esc(DB.media[S.lessonId].note)}</p>`:''}<p class="small muted"><b>Goal:</b> ${esc(S.L.goal)}<br><b>ND ELA:</b> ${codesFor(S.lessonId, S.st?S.st.grade:6).join(', ')}</p><div class="actions"><button class="btn primary" data-close>Close</button></div>`);
  $('#back')&&($('#back').onclick=()=>{S.phase--; renderSession();});
  $('#next')&&($('#next').onclick=()=>{S.phase++; renderSession();});
}
const nextPhaseName=()=>S.phases[S.phase+1]?S.phases[S.phase+1].t:'';

/* ---------- scene builder (scene + bubbles + spots) ---------- */
function sceneHTML(sc, opts={}){
  if(sc.face) return `<div class="facewrap">${sceneSVG(sc)}</div>`;
  const bubs = bubbleAnchors(sc).map((b,i)=>`<div class="bub ${b.kind||''}" style="left:${b.px}%;top:${b.py}%" data-ax="${b.px}" data-ay="${b.py}" data-say="${esc(b.text)}">${esc(b.text)}</div>`).join('');
  const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
  const spots = (opts.spots!==false?(sc.spots||[]):[]).map((s,i)=>`<button class="spot" data-spot="${i}" style="left:${cl((s.x+(s.ox==null?40:s.ox))/8,4,96)}%;top:${cl((s.y+(s.oy==null?-42:s.oy))/4.5,6,94)}%" aria-label="Clue ${i+1}">${i+1}</button>`).join('');
  return `<div class="scene" data-scene>${sceneSVG(sc)}${bubs}${spots}</div>`;
}
function wireSpots(root, sc, onFind){
  $$('.spot',root).forEach(b=>b.onclick=()=>{
    const i=+b.dataset.spot, s=sc.spots[i];
    $$('.spotlabel',root).forEach(l=>l.remove());
    b.classList.add('found');
    const lab=document.createElement('div'); lab.className='spotlabel'; lab.style.left=(s.x/8)+'%'; lab.style.top=(s.y/4.5)+'%'; lab.style.background=SCOPE_STEPS[s.k||'C'].color; lab.textContent=s.label;
    b.parentElement.appendChild(lab); speak(s.label);
    onFind&&onFind(i);
  });
}

/* keep speech bubbles inside the scene and apart from each other */
function fitBubbles(){
  $$('[data-scene]').forEach(sc=>{
    const W=sc.clientWidth, H=sc.clientHeight; if(!W) return;
    const bs=$$('.bub',sc); const M=6;
    const boxes=bs.map(b=>{b.style.transform='none'; const w=b.offsetWidth, h=b.offsetHeight;
      const ax=parseFloat(b.dataset.ax)/100*W, ay=parseFloat(b.dataset.ay)/100*H;
      const o={b, w, h, x:ax-w/2, y:ay-h, ax, side:false};
      if(o.y<M){ o.side=true; o.y=Math.max(M, ay+8); o.x = ax+34; if(o.x+w>W-M) o.x=ax-34-w; }
      return o;});
    const clampX=o=>{o.x=Math.max(M,Math.min(W-M-o.w,o.x));};
    boxes.forEach(o=>{clampX(o); if(o.y<M) o.y=M; if(o.y+o.h>H-M) o.y=H-M-o.h;});
    boxes.sort((a,b)=>a.x-b.x);
    for(let pass=0;pass<3;pass++) for(let i=1;i<boxes.length;i++){const a=boxes[i-1], c=boxes[i];
      const ox=a.x+a.w+M-c.x, oy=Math.min(a.y+a.h,c.y+c.h)-Math.max(a.y,c.y);
      if(ox>0&&oy>0){a.x-=ox/2; c.x+=ox/2; clampX(a); clampX(c); const still=a.x+a.w+M-c.x; if(still>0){ if(c.y<=a.y) c.y=Math.max(M,a.y-c.h-M); else c.y=a.y+a.h+M; }}}
    boxes.forEach(o=>{o.b.style.left=o.x+'px'; o.b.style.top=o.y+'px'; const tail=Math.max(14,Math.min(o.w-14,o.ax-o.x)); o.b.style.setProperty('--tail',tail+'px'); o.b.classList.toggle('side',o.side);});
  });
}

function phaseWarm(stage){
  const w=S.warm;
  stage.innerHTML = `<div class="goalbox" style="max-width:980px;margin:0 auto 18px"><span style="font-size:32px">🎯</span><div class="say sm" style="flex:1">${esc(S.L.goal)}</div>${spk(S.L.goal)}</div><div id="witem"></div>`;

/* ---------- EXPLORE ---------- */
function phaseExplore(stage){
  const ex=S.explore, md=DB.media[S.lessonId];
  const tabs=[['scene','Scene']]; if(md&&md.video) tabs.push(['video','Video']); if(md&&md.pic) tabs.push(['pic','Picture']);
  S.mtab=S.mtab||'scene';
  const step=S.stepList[S.stepIdx]; S.seen[S.stepIdx]=true;
  let media='';
  if(S.mtab==='scene') media=sceneHTML(ex.scene);
  if(S.mtab==='video'){const id=ytId(md.video); media = id?`<div class="mediabox"><iframe src="https://www.youtube-nocookie.com/embed/${id}?rel=0" allow="encrypted-media; picture-in-picture" allowfullscreen title="Video"></iframe></div>`:`<div class="panel"><p>This video opens in a new tab.</p><a class="btn primary" href="${esc(md.video)}" target="_blank" rel="noopener">Open video</a></div>`;}
  if(S.mtab==='pic') media=`<div class="mediabox"><img src="${esc(md.pic)}" alt="SLP picture"></div>`;
  stage.innerHTML = `<div class="explore">
    <div>
      ${tabs.length>1?`<div class="mediatabs">${tabs.map(t=>`<button data-tab="${t[0]}" class="${S.mtab===t[0]?'on':''}">${t[1]}</button>`).join('')}</div>`:''}
      ${media}
      ${S.mtab==='scene'&&ex.scene.spots&&ex.scene.spots.length?`<p class="small muted kid" style="margin:10px 2px 0">Tap the yellow circles to find clues. Tap a speech bubble to hear it.</p>`:''}
      ${ex.tone?toneCards(ex.tone):''}
    </div>
    <div class="steps">
      <div class="ministeps">${S.stepList.map((s,i)=>`<button data-si="${i}" class="${i===S.stepIdx?'on':S.seen[i]?'seen':''}" style="background:${SCOPE_STEPS[s.k].color}" aria-label="${SCOPE_STEPS[s.k].word}${s.compare?' bonus':''}">${s.compare?'+':s.k}</button>`).join('')}</div>
      <div id="stepcard"></div>
    </div>
  </div>`;
  $$('[data-tab]').forEach(b=>b.onclick=()=>{S.mtab=b.dataset.tab; renderSession();});
  $$('[data-si]').forEach(b=>b.onclick=()=>{S.stepIdx=+b.dataset.si; renderSession();});
  wireSpots(stage, ex.scene);
  $$('[data-tone]').forEach(b=>b.onclick=()=>{b.querySelector('.means').classList.remove('hidden'); b.querySelector('.tapto')&&b.querySelector('.tapto').remove();});
  const card=$('#stepcard'); const st=SCOPE_STEPS[step.k];
  if(step.compare){
    card.innerHTML=`<div class="step"><div class="hd"><div class="badge" style="background:${st.color}">+</div><div class="word">Same words, new place</div></div><div id="cmp"></div></div>`;
    renderItem($('#cmp'), Object.assign({compact:true},step.compare), ()=>{});
  } else {
    const ansHTML = Array.isArray(step.a) ? `<ul>${step.a.map((a,i)=>`<li class="${step.best===i?'best':''}">💭 ${esc(a)} ${spk(a)}${step.best===i?'<span class="bt">best fit</span>':''}</li>`).join('')}</ul>` : `<div class="say sm">${esc(step.a)} ${spk(step.a)}</div>`;
    card.innerHTML=`<div class="step"><div class="hd"><div class="badge" style="background:${st.color}">${step.k}</div><div><div class="word">${st.word}</div></div></div>
      <div class="qrow"><div class="say">${esc(step.q)}</div>${spk(step.q)}</div>
      <div class="stepnav"><button class="btn" id="showA">💡 Show ${Array.isArray(step.a)?'ideas':'an idea'}</button></div>
      <div class="ans hidden" id="ans">${ansHTML}</div></div>`;
    $('#showA').onclick=()=>{$('#ans').classList.remove('hidden'); $('#showA').remove();};
  }
  const last = S.stepIdx===S.stepList.length-1;
  slpBar(`<span class="tip">Let the student answer first. Then tap <b>Show</b>.</span>${S.stepIdx>0?'<button class="btn" id="prevStep">← Step</button>':''}${!last?`<button class="btn" id="nextStep">Next step: ${S.stepList[S.stepIdx+1].compare?'Bonus':SCOPE_STEPS[S.stepList[S.stepIdx+1].k].word} →</button>`:''}`, nextPhaseName());
  $('#prevStep')&&($('#prevStep').onclick=()=>{S.stepIdx--; renderSession();});
  $('#nextStep')&&($('#nextStep').onclick=()=>{S.stepIdx++; renderSession();});
}
function toneCards(t){
  return `<div class="bigline" style="margin-top:16px;font-size:40px;padding:10px">“${esc(t.line)}”</div>
  <p class="small muted" style="margin:8px 2px">SLP: say the line each way. Student guesses the meaning, then tap the card.</p>
  <div class="tones">${t.ways.map(w=>`<button class="tone" data-tone><div class="em">${w.icon}</div><div class="t">${esc(w.tone)}</div><div class="how">Say it: ${esc(w.how)}</div><div class="tapto small muted" style="margin-top:6px">Tap to see the meaning</div><div class="means hidden">${esc(w.means)}</div></button>`).join('')}</div>`;
}

/* ---------- TALK ---------- */
function phaseTalk(stage){
  const t=S.talk; const prompts=S.short?t.prompts.slice(0,1):t.prompts;
  stage.innerHTML=`<div class="talk">
    ${prompts.map((p,i)=>`<div class="prompt"><span style="font-size:30px">${i?'🗨️':'💬'}</span><div class="q say">${esc(p)}</div>${spk(p)}</div>`).join('')}
    <div><div class="say sm" style="margin-bottom:10px">Sentence starters</div><div class="starters">${t.starters.map(s=>`<button class="starter" data-say="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>
  </div>`;
  slpBar('<span class="tip">Talk it through. Tap a starter to hear it. Encourage more than one idea.</span>', nextPhaseName());
}

/* ---------- TRY IT ---------- */
function phaseTry(stage){
  const items=S.tryItems; const i=Math.min(S.tryIdx, items.length-1);
  stage.innerHTML=`<div class="row" style="justify-content:center;margin-bottom:12px"><h2 style="font-size:26px">${esc(S.tryTitle)}</h2></div><div class="prog" style="margin-bottom:14px">${items.map((_,k)=>`<i class="${k<i?'done':k===i?'on':''}"></i>`).join('')}</div><div id="titem"></div>`;
  let answered=false;
  renderItem($('#titem'), items[i], ()=>{answered=true; const nb=$('#nextItem'); if(nb) nb.disabled=false;});
  const last=i===items.length-1;
  slpBar(`<span class="tip">Practice round. No data is recorded here.</span>${!last?`<button class="btn" id="nextItem">Next item →</button>`:''}${i>0?'<button class="btn" id="prevItem">← Item</button>':''}`, nextPhaseName());
  $('#nextItem')&&($('#nextItem').onclick=()=>{S.tryIdx++; renderSession();});
  $('#prevItem')&&($('#prevItem').onclick=()=>{S.tryIdx--; renderSession();});
}

/* ---------- CHECK ---------- */
function phaseCheck(stage){
  const items=S.checkItems; const i=Math.min(S.chkIdx, items.length-1); const r=S.results[i];
  stage.innerHTML=`<div class="row" style="justify-content:center;margin-bottom:12px"><h2 style="font-size:26px">Quick check</h2></div><div class="prog" style="margin-bottom:14px">${items.map((_,k)=>`<i class="${k<i?'done':k===i?'on':''}"></i>`).join('')}</div><div id="citem"></div>`;
  const draw=()=>{
    const m=r.mark||r.sug;
    slpBar(`<span class="tip">Mark ${i+1} of ${items.length}:</span><div class="marks">${[['I','Independent'],['P','Prompted'],['X','Incorrect']].map(([k,t])=>`<button data-m="${k}" class="${m===k?'on':''} ${!r.mark&&r.sug===k?'sug':''}" title="${t}">${t}</button>`).join('')}</div>${!r.mark&&r.sug?'<span class="small" style="opacity:.8">Suggested from the student’s taps. Tap to change.</span>':''}
      ${i>0?'<button class="btn" id="prevC">← Item</button>':''}${i<items.length-1?`<button class="btn" id="nextC" ${m?'':'disabled'}>Next item →</button>`:''}`,
      nextPhaseName(), i===items.length-1 && !!(m));
    $$('.marks button').forEach(b=>b.onclick=()=>{r.mark=b.dataset.m; draw();});
    $('#nextC')&&($('#nextC').onclick=()=>{S.chkIdx++; renderSession();});
    $('#prevC')&&($('#prevC').onclick=()=>{S.chkIdx--; renderSession();});
    if(i===items.length-1){ const nb=$('#next'); if(nb){ nb.onclick=()=>{ S.results.forEach(x=>{ if(!x.mark) x.mark=x.sug||'X'; }); S.phase++; renderSession(); }; } }
  };
  renderItem($('#citem'), items[i], res=>{ if(r.first===null){r.first=res.first; r.tries=res.tries; r.sug = res.first?'I':(res.correct?'P':'X');} draw(); }, r.first!==null);
  draw();
}

/* ---------- DONE ---------- */
function phaseDone(stage){
  const R=S.results; R.forEach(x=>{if(!x.mark) x.mark=x.sug||'X';});
  const n=R.length, I=R.filter(x=>x.mark==='I').length, P=R.filter(x=>x.mark==='P').length, X=n-I-P;
  const mins=Math.max(1,Math.round((Date.now()-S.start)/60000));
  const pInd=pct(I,n), pCor=pct(I+P,n);
  let nx=null, alt='';
  if(!S.preview){ nx=computeNext(S.st,S.lessonId,S.type,S.p); }
  const ready = pInd>=SETTINGS.masteryPercent;
  stage.innerHTML=`<div class="done">
    <div class="stamp">You did it!</div>
    <div class="goalbox"><span style="font-size:32px">⭐</span><div class="say sm">${esc(S.L.goal)}</div>${spk(S.L.goal)}</div>
    <div class="slpdone">
      <h3>Session summary ${S.preview?'(preview — not saved)':''}</h3>
      <div class="row"><div class="stat"><b>${pInd}%</b><span class="small">independent</span></div><div class="stat"><b>${pCor}%</b><span class="small">correct with prompts</span></div><div class="stat"><b>${I} / ${P} / ${X}</b><span class="small">I / P / X</span></div></div>
      <table style="margin-top:12px"><thead><tr><th>#</th><th>Item</th><th>Mark</th></tr></thead><tbody>${R.map((x,k)=>`<tr><td>${k+1}</td><td>${esc(x.q)}${x.line?` <i>“${esc(x.line)}”</i>`:''}</td><td class="minimarks">${['I','P','X'].map(m=>`<button data-k="${k}" data-m="${m}" class="${x.mark===m?'on':''}">${m}</button>`).join(' ')}</td></tr>`).join('')}</tbody></table>
      ${S.preview?'':`<div class="row" style="margin-top:12px;align-items:flex-end"><div style="width:110px"><label>Minutes</label><input id="dn_min" type="number" min="1" max="60" value="${mins}"></div><div style="flex:1"><label>Notes</label><input id="dn_notes" placeholder="Prompts used, what clicked, what to try next"></div></div>
      <label>Next session</label>
      <select id="dn_next">
        <option value="auto">${esc(nextLabel(nx))} (on schedule)</option>
        <option value="repeat">Repeat: ${esc(nextLabel({lesson:S.lessonId,type:'practice',p:S.type==='core'?1:S.p+1}))}</option>
        ${isBuilt(S.lessonId+1)?`<option value="move">Move on: ${esc(nextLabel({lesson:S.lessonId+1,type:'core',p:0}))}</option>`:''}
        <option value="redo">Redo the core lesson: Lesson ${S.lessonId}</option>
      </select>
      ${ready && S.type==='core' && isBuilt(S.lessonId+1)?`<p class="small" style="color:var(--ok);font-weight:700">${pInd}% independent — at or above ${SETTINGS.masteryPercent}%. Moving on early is an option.</p>`:''}
      ${nx&&nx.waiting?`<p class="small muted">Lesson ${nx.waiting} isn’t built yet, so the next session is extra practice with new items.</p>`:''}`}
    </div>
  </div>`;
  $$('.minimarks button').forEach(b=>b.onclick=()=>{S.results[+b.dataset.k].mark=b.dataset.m; phaseDone(stage);});
  if(S.preview){ slpBar('<span class="tip">Preview finished. Nothing was saved.</span><button class="btn go" id="fin">Close preview</button>'); $('#fin').onclick=()=>{endSession(); renderLibrary();}; return; }
  slpBar(`<span class="tip">Check the marks, add a note, and save.</span><button class="btn go" id="saveSess">✔ Save session</button>`);
  $('#saveSess').onclick=()=>{
    const R2=S.results, n2=R2.length, I2=R2.filter(x=>x.mark==='I').length, P2=R2.filter(x=>x.mark==='P').length;
    const c=catalog(S.lessonId), st=S.st;
    const rec={id:uid(), studentId:st.id, ts:Date.now(), date:todayISO(), lesson:S.lessonId, title:c[2], unit:c[1], type:S.type, p:S.type==='core'?0:S.p,
      focus:Array.from(new Set(S.stepList.map(s=>s.k))).join(''), codes:codesFor(S.lessonId, st.grade), sel:S.L.sel||[], grade:st.grade,
      n:n2, ind:I2, prm:P2, inc:n2-I2-P2, pctInd:pct(I2,n2), pctCorrect:pct(I2+P2,n2), minutes:+$('#dn_min').value||mins, short:S.short,
      notes:$('#dn_notes').value.trim(), items:R2.map(x=>({q:x.q, mark:x.mark}))};
    const choice=$('#dn_next').value;
    if(choice==='auto') st.next=nx;
    else if(choice==='repeat') st.next={lesson:S.lessonId,type:'practice',p:S.type==='core'?1:S.p+1};
    else if(choice==='move') st.next={lesson:S.lessonId+1,type:'core',p:0};
    else st.next={lesson:S.lessonId,type:'core',p:0};
    DB.sessions.push(rec);
    if(save()){ S.saved=true; toast('Session saved for '+st.name.replace(/\.$/,'')+'.'); clearInterval(timerInt); const id=st.id; S=null; renderStudent(id); }
  };
}

/* ============================================================
   ITEM RENDERER (quiz / pick / detective / sort / open)
   onDone({correct, first, tries})
   ============================================================ */
function renderItem(root, it, onDone, locked){
  const type=it.type||'quiz';
  const pic = it.scene ? sceneHTML(it.scene, {spots:type==='detective'}) : it.face ? sceneHTML({face:it.face}) : '';
  const lineHTML = it.line ? `<div class="bigline">“${esc(it.line)}”${it.slp?`<button class="peek" data-peek>Hold: SLP peek</button>`:''}</div>${it.slp?'<p class="small muted" style="text-align:center;margin:0">SLP reads it aloud. Hold the peek button to see how. (The speaker button reads it flat.)</p>':''}` : '';
  const qHTML = `<div class="qrow"><div class="say">${esc(it.q)}</div>${spk(it.q)}</div>`;
  if(type==='open'){
    root.innerHTML = `<div class="item ${pic?'withpic':''}">${qHTML}${pic}</div>`; if(it.scene) wireSpots(root,it.scene); return;
  }
  if(type==='sort') return renderSort(root,it,onDone);
  if(type==='pick') return renderPick(root,it,onDone);
  const choices = `<div class="choices ${it.choices.length>=4&&!pic?'many':''}">${it.choices.map((c,i)=>`<button class="choice" data-c="${i}">${esc(c)}</button>`).join('')}</div><div id="fb"></div>`;
  const body = type==='detective'
    ? `<div class="item withpic">${qHTML}<div class="itemgrid"><div>${pic}<p class="kid small muted" style="margin:8px 2px">Tap the yellow circles.</p></div><div><div class="counter" id="cnt">Clues found: 0 / ${it.scene.spots.length}</div><div id="chwrap" class="hidden" style="margin-top:12px">${choices}</div></div></div></div>`
    : pic && !it.compact ? `<div class="item withpic">${qHTML}<div class="itemgrid"><div>${pic}</div><div>${lineHTML}${choices}</div></div></div>`
    : `<div class="item">${pic}${qHTML}${lineHTML}${choices}</div>`;
  root.innerHTML = body;
  if(type==='detective'){
    const found=new Set(); wireSpots(root, it.scene, i=>{found.add(i); $('#cnt',root).textContent=`Clues found: ${found.size} / ${it.scene.spots.length}`; if(found.size===it.scene.spots.length) $('#chwrap',root).classList.remove('hidden');});
  }
  const pk=$('[data-peek]',root);
  if(pk){ const show=e=>{e.preventDefault(); if($('.peekout',pk.parentElement)) return; const d=document.createElement('div'); d.className='peekout'; d.innerHTML=`Say it: ${esc(it.slp.read)}<br><span style="font-size:15px;font-weight:600">${esc(it.slp.how)}</span>`; pk.parentElement.appendChild(d);};
    const hide=()=>{$$('.peekout',root).forEach(x=>x.remove());};
    pk.addEventListener('pointerdown',show); pk.addEventListener('pointerup',hide); pk.addEventListener('pointerleave',hide); pk.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter')show(e);}); pk.addEventListener('keyup',hide); }
  let tries=0, done=false;
  const finish=(correct)=>{done=true; $$('.choice',root).forEach((b,i)=>{b.disabled=true; if(it.ans.includes(i)) b.classList.add('right'); else b.classList.add('dim');});
    const fb=$('#fb',root); fb.innerHTML=`<div class="fb ${correct?'ok':'no'}">${correct?'✅ ':'👉 '}${esc(it.why||'')} ${spk(it.why||'')}</div>`;
    onDone({correct, first:correct&&tries===1, tries}); };
  if(locked){ finish(true); return; }
  $$('.choice',root).forEach(b=>b.onclick=()=>{ if(done) return; tries++; const i=+b.dataset.c;
    if(it.ans.includes(i)) finish(true);
    else { b.classList.add('wrong'); b.disabled=true; if(tries>=2) finish(false); else $('#fb',root).innerHTML=`<div class="fb no">Look again. ${it.hint?esc(it.hint):'Check the clues.'}</div>`; } });
}

function renderPick(root,it,onDone){
  const sc=it.scene, boxes=charBoxes(sc);
  root.innerHTML=`<div class="item withpic"><div class="qrow"><div class="say">${esc(it.q)}</div>${spk(it.q)}</div>
    <div style="position:relative;max-width:700px;width:100%;margin:0 auto">${sceneHTML(sc,{spots:false})}</div>
    <div class="row" style="justify-content:center"><button class="btn big go" id="pkCheck">Check</button></div><div id="fb"></div></div>`;
  const scEl=$('[data-scene]',root);
  boxes.forEach(b=>{const d=document.createElement('button'); d.className='pickbox'; d.dataset.id=b.id; d.style.cssText=`left:${b.left}%;top:${b.top}%;width:${b.w}%;height:${b.h}%`; d.setAttribute('aria-label',b.name); d.innerHTML=`<span class="nm">${esc(b.name)}</span>`; d.onclick=()=>{ if(doneP) return; d.classList.toggle('sel'); }; scEl.appendChild(d);});
  let tries=0, doneP=false;
  $('#pkCheck',root).onclick=()=>{ if(doneP) return; tries++;
    const sel=$$('.pickbox.sel',root).map(b=>b.dataset.id).sort().join(','), ok=it.ok.slice().sort().join(',');
    const correct = sel===ok;
    if(correct || tries>=2){ doneP=true; $$('.pickbox',root).forEach(b=>{b.classList.remove('sel'); b.classList.add(it.ok.includes(b.dataset.id)?'right':'wrong');}); $('#pkCheck',root).remove();
      $('#fb',root).innerHTML=`<div class="fb ${correct?'ok':'no'}">${correct?'✅ ':'👉 '}${esc(it.why)} ${spk(it.why)}</div>`; onDone({correct, first:correct&&tries===1, tries}); }
    else $('#fb',root).innerHTML=`<div class="fb no">Not quite. Look at which way each person is facing. Try again.</div>`;
  };
}

function renderSort(root,it,onDone){
  const place={}; let sel=null, tries=0, doneS=false;
  const draw=()=>{
    const unplaced=it.items.map((x,i)=>i).filter(i=>place[i]==null);
    root.innerHTML=`<div class="item sortwrap"><div class="qrow"><div class="say sm">${esc(it.q)}</div>${spk(it.q)}</div>
      <div class="sortcards">${unplaced.map(i=>`<button class="scard2 ${sel===i?'sel':''}" data-i="${i}">${esc(it.items[i].t)}</button>`).join('')||'<span class="muted kid">All cards are in a box.</span>'}</div>
      <div class="bins">${it.bins.map((b,bi)=>`<div class="bin ${sel!=null?'ready':''}" data-b="${bi}" role="button" tabindex="0"><h4>${esc(b)}</h4>${it.items.map((x,i)=>place[i]===bi?`<button class="scard2 ${doneS?(x.bin===bi?'right':'wrong'):''}" data-back="${i}">${esc(x.t)}</button>`:'').join('')}</div>`).join('')}</div>
      ${!unplaced.length&&!doneS?'<div class="row" style="justify-content:center"><button class="btn big go" id="sCheck">Check</button></div>':''}<div id="fb"></div></div>`;
    $$('[data-i]',root).forEach(b=>b.onclick=()=>{sel=+b.dataset.i; speak(it.items[sel].t); draw();});
    $$('[data-b]',root).forEach(b=>b.onclick=e=>{ if(e.target.closest('[data-back]')) return; if(sel==null||doneS) return; place[sel]=+b.dataset.b; sel=null; draw();});
    $$('[data-back]',root).forEach(b=>b.onclick=()=>{ if(doneS) return; delete place[+b.dataset.back]; draw();});
    $('#sCheck',root)&&($('#sCheck',root).onclick=()=>{ tries++;
      const wrong=it.items.map((x,i)=>i).filter(i=>place[i]!==it.items[i].bin);
      if(!wrong.length || tries>=2){ if(wrong.length) wrong.forEach(i=>place[i]=place[i]); doneS=true; draw(); $('#fb',root).innerHTML=`<div class="fb ${wrong.length?'no':'ok'}">${wrong.length?'👉 The red cards belong in the other box. ':'✅ '}${esc(it.why)}</div>`; onDone({correct:!wrong.length, first:!wrong.length&&tries===1, tries}); }
      else { wrong.forEach(i=>delete place[i]); draw(); $('#fb',root).innerHTML=`<div class="fb no">${wrong.length} card${wrong.length>1?'s':''} came back. Try those again.</div>`; }
    });
  };
  draw();
}

/* ---------- boot ---------- */
document.title = SETTINGS.appTitle;
renderHome();

</script>
